name: i18n check

# Validates the localization RESX files on every PR/push that touches them:
# English source and complete French only: matching keys, valid XML, consistent placeholders.
# This guards against community translation PRs that drop keys or break interpolation.
on:
  pull_request:
    paths:
      - 'src/LuaToolsGui/Resources/Strings*.resx'
      - 'scripts/check-i18n.py'
      - '.github/workflows/i18n-check.yml'
  push:
    branches: [master, main, security-hardened]
    paths:
      - 'src/LuaToolsGui/Resources/Strings*.resx'
      - 'scripts/check-i18n.py'
      - '.github/workflows/i18n-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate translations
        run: python scripts/check-i18n.py
