<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:"Segoe UI",sans-serif;color:#eee}.screen{background:#202020;padding:24px;border-radius:8px;max-width:640px;margin:auto}h1{font-size:22px;margin:0}h2{font-size:13px;color:#9ca3af;margin:24px 0 8px;font-weight:600}.card{background:#ffffff08;border:1px solid #ffffff12;border-radius:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 14px;padding:12px 0;min-height:22px;font-size:13px}.row+.row{border-top:1px solid #ffffff10}button{border:1px solid #aaa;background:transparent;border-radius:14px;width:40px;height:20px;flex-shrink:0;padding:3px;cursor:pointer}button:before{content:"";display:block;width:12px;height:12px;border-radius:50%;background:#aaa}button[aria-checked=true]{background:#a78bfa;border-color:#a78bfa}button[aria-checked=true]:before{margin-left:18px;background:#202020}button:focus-visible{outline:2px solid white;outline-offset:3px}</style></head><body><div class="screen"><h1>Settings</h1><h2>EXECUTABLE WORKFLOWS</h2><div class="card"><div class="row"><span>Executable game fixes</span><button role="switch" aria-label="Executable game fixes" aria-checked="false" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"></button></div><div class="row"><span>BetterSteamTools</span><button role="switch" aria-label="BetterSteamTools" aria-checked="false" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"></button></div><div class="row"><span>OpenSteamTools</span><button role="switch" aria-label="OpenSteamTools" aria-checked="false" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"></button></div><div class="row"><span>Steam plugin</span><button role="switch" aria-label="Steam plugin" aria-checked="false" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"></button></div><div class="row"><span>DepotDownloaderMod</span><button role="switch" aria-label="DepotDownloaderMod" aria-checked="false" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"></button></div><div class="row"><span>Steamless</span><button role="switch" aria-label="Steamless" aria-checked="false" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"></button></div><div class="row"><span>SteamAutoCrack</span><button role="switch" aria-label="SteamAutoCrack" aria-checked="false" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"></button></div><div class="row"><span>CloudRedirect</span><button role="switch" aria-label="CloudRedirect" aria-checked="false" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"></button></div></div></div></body></html>
